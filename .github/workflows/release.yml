# Publish quarterdeck to PyPI through Trusted Publishing (OIDC: no API
# token anywhere), with PEP 740 attestations.  provost's release.yml is the
# model.
#
# One-time setup, done on PyPI by the account owner (a session cannot):
#   https://pypi.org/manage/account/publishing/ -> "Add a new pending
#   publisher": PyPI project quarterdeck, owner MartinGallagher-code,
#   repository quarterdeck, workflow release.yml, environment pypi.
# and, in this repository's Settings -> Environments, an environment named
# pypi (protection rules optional).
#
# Then either of these uploads the sdist and wheel to PyPI:
#   - publishing a GitHub release tagged vX.Y.Z (built from that tag), or
#   - "Run workflow" (workflow_dispatch) on main (built from main's tip;
#     this makes no tag and no GitHub release).
# There is no TestPyPI dry run (QD-023): PyPI is the only target.
name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The three places CLAUDE.md names must agree on the version, or the
      # upload is refused.  A release's tag must agree with them too.  The
      # button has no tag to check, so it publishes main and nothing else:
      # PyPI never lets a number be reused, so a branch's upload could not
      # be taken back.
      - name: Version agrees with itself, and with the tag
        run: |
          bash tests/check_version.sh
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            want="${GITHUB_REF_NAME#v}"
            have="$(python -c 'import quarterdeck; print(quarterdeck.VERSION)')"
            if [ "$want" != "$have" ]; then
              echo "tag $GITHUB_REF_NAME but quarterdeck says $have" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run workflow publishes main only, and this run is on $GITHUB_REF" >&2
            exit 1
          fi

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/v/bin/qd" --version
          "$RUNNER_TEMP/v/bin/qd" --help > /dev/null

      # The floor: the wheel is built on 3.12, and must install and run on
      # 3.6 (the build backend cannot run there, so it is not built there).
      - name: Install the wheel on Python 3.6
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.6 \
            bash -euxc 'python -m venv /v && /v/bin/pip install -q /dist/*.whl && /v/bin/qd --version && /v/bin/qd --help > /dev/null'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/quarterdeck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
