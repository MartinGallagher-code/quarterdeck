name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest became 26.04 in November 2026, and setup-python has no
    # 3.9 for it; 24.04 still has every version in the matrix (QD-014)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Every version the hosted runners still provide. The declared floor
        # is 3.6, which setup-python can no longer install, so the bottom of
        # the range runs in a container in the python-floor job below.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # qd files everything through provost, so the suites need a real one:
      # PyPI's newest -- one capture at a time until a release has `batch`,
      # the batch path from then on (the provost-2-1 job below keeps the
      # older path tested).  binnacle's muster, reachable and the scripts
      # probes push are the real ones too, and so is doe for designs.  ssh
      # and scp are faked, the rest of the toolchain is played by
      # stand-ins, and the web suite's server listens on loopback.
      - name: Install provost and binnacle
        run: python -m pip install provost binnacle

      # PyPI's doehelper wants 3.10; on 3.9 the doe suite runs against its
      # stand-in only, as it does in the 3.6 job.
      - name: Install doe
        if: matrix.python-version != '3.9'
        run: python -m pip install doehelper

      # One suite per core at a time, the slowest first, each suite's
      # output printed whole when it ends; the log's last lines give the
      # wall time and the longest suites.
      - name: Run the test suite
        run: bash tests/run_tests.sh

  python-floor:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches stdlib APIs newer than the floor, which a syntax-only compile
      # check cannot see. The machine the fleet is driven from is as often a
      # RHEL 8 jump host, which ships 3.6, as anything newer.
      - name: Scan for post-3.6 syntax and stdlib APIs
        run: |
          python -m pip install --upgrade vermin
          bash tests/check_python_compat.sh
          vermin --eval-annotations --violations --target=3.6- quarterdeck/*.py qd

      # provost's launcher wants 3.8, but provost itself is bash and git: its
      # bundle runs under any Python.  The full image has git; -slim has not.
      - name: Fetch provost's bundle
        run: |
          python -m pip download --no-deps --only-binary=:all: -d .pv provost
          python -m zipfile -e .pv/provost-*.whl .pv/x

      # The container sees the runner's cores, so the suites run side by
      # side here too.
      - name: Run the suite under real Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e QD_PROVOST="bash /w/.pv/x/provost_data/_bundle/provost" \
            python:3.6 \
            bash -euxc 'pip install -q binnacle && bash tests/check_python_compat.sh && bash tests/run_tests.sh'

  provost-2-1:
    # PyPI's provost 2.1.0 has no `batch`: it files a run one capture at a
    # time, strips quotes inside TSV cells, and drops nested JSON keys where
    # there is no jq.  The jobs above take PyPI's newest provost, so this
    # one keeps the oldest qd supports under the whole suite.
    name: test (provost 2.1.0, one capture at a time)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provost 2.1.0, binnacle and doe
        run: python -m pip install "provost==2.1.0" binnacle doehelper

      # The longest job, one capture at a time: suites side by side, as above.
      - name: Run the test suite
        run: bash tests/run_tests.sh

  version:
    # Every change moves the version in three places (CLAUDE.md; shared_tools
    # BN-002, whose templates/version-job.yml the last two steps are). A pull
    # request that moves one and not the others fails the first step; one
    # whose version is not greater than the base branch's fails the second;
    # a push to main whose version is not greater than what main was before
    # it fails the third, which catches two pull requests that took the same
    # number.
    name: version in three places
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare __init__.py, pyproject.toml and CHANGELOG.md
        run: bash tests/check_version.sh

      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD

      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD

  web:
    name: web page syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse app.js
        run: node --check quarterdeck/web/app.js

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # SC1091 only says shellcheck cannot open the sourced helper from its
      # own working directory; following it (-x) makes every test function
      # look unreachable, because run_test calls them by name.
      - name: Run shellcheck over the test harness
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 tests/*.sh tests/test_helper.bash

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check licensing headers
        run: |
          python -m pip install --upgrade reuse
          reuse lint

  build:
    name: build the wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      # The page ships as package data; a wheel without it starts a server
      # with nothing to serve, so prove it is there and answers.
      - name: Install the wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl provost
          export QD_STORE="$RUNNER_TEMP/store"
          qd --version
          quarterdeck --version
          qd hints > /dev/null
          qd probe > /dev/null
          printf 'a rack=r1\nb rack=r2\n' > h.txt
          qd split -s h.txt --by rack
          python -c "import os, quarterdeck.web as w; assert os.path.isfile(os.path.join(w.STATIC, 'app.js'))"
          printf 'host,v\na,1\nb,2\n' > t.csv
          qd import t.csv > /dev/null
          qd stats latest v

      # The floor: what PyPI will serve must install and start on 3.6, in a
      # venv of its own, though it is built on a newer Python (QD-007).
      - name: Install the wheel on Python 3.6
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.6 \
            bash -euxc 'python -m venv /v && /v/bin/pip install -q /dist/*.whl && /v/bin/qd --version && /v/bin/qd --help > /dev/null'
